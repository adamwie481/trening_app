name: Budowanie APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Utwórz projekt Androida
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Dziennik treningowy" pl.trening.dziennik --web-dir web
          npx cap add android
          npx cap sync android

      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dziennik-treningowy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
