name: Budowanie APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Utwórz projekt Androida
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          APP_URL="https://${OWNER}.github.io/${REPO}/" node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'pl.trening.dziennik',appName:'Dziennik treningowy',webDir:'web',server:{url:process.env.APP_URL,androidScheme:'https'}},null,2))"
          cat capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Napraw pasek stanu
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme/a\        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>' "$f"
          grep -c OptOut "$f"

      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dziennik-treningowy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
