name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Wpisz numer wersji
        run: |
          V="${GITHUB_SHA::7}"
          B="$(TZ=Europe/Warsaw date '+%d.%m.%Y %H:%M')"
          sed -i "s/__BUILD__/$V/; s/__BUILT__/$B/" web/index.html
          printf '{"v":"%s","built":"%s"}' "$V" "$B" > web/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
