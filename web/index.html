<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5FBF">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dziennik treningowy</title>

<style>
/* Layout: one narrow column like a logbook page. Dates sit in a left margin, sets read as "15 × 8 kg", progress is signalled by arrows and words, never by colour alone. */
:root{
  --f-disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#E8EBF0; --surface:#FFFFFF; --surface2:#F2F4F8; --ink:#0F1724; --muted:#566074; --line:#D2D8E1;
  --accent:#1F5FBF; --on-accent:#FFFFFF;
  --up:#147548; --up-bg:#DCF2E6; --down:#B23F0B; --down-bg:#FBE5D9; --flat:#566074; --flat-bg:#E3E7EE;
  --scrim:rgba(8,12,18,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1016; --surface:#151A22; --surface2:#1C222C; --ink:#E7ECF3; --muted:#9AA5B6; --line:#2A3240;
    --accent:#6AA3FF; --on-accent:#0B1220;
    --up:#4CD08C; --up-bg:#12301F; --down:#FF9560; --down-bg:#3A1E10; --flat:#9AA5B6; --flat-bg:#232A35;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1016; --surface:#151A22; --surface2:#1C222C; --ink:#E7ECF3; --muted:#9AA5B6; --line:#2A3240;
  --accent:#6AA3FF; --on-accent:#0B1220;
  --up:#4CD08C; --up-bg:#12301F; --down:#FF9560; --down-bg:#3A1E10; --flat:#9AA5B6; --flat-bg:#232A35;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 var(--f-body);
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  padding-block:8px 112px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:600px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:700 38px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
h2{font:600 22px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
h3{font:600 24px/1.1 var(--f-disp);letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:4px;padding:18px 0 14px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec>.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{min-height:48px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn.danger{background:var(--down-bg);color:var(--down);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.txt{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:16px}
textarea.txt{resize:vertical;min-height:64px}
.num{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:600 22px var(--f-disp);text-align:center;padding:0 4px}
.num.wide{font-size:20px}

/* log list */
.wcard{display:grid;grid-template-columns:58px 1fr 18px;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.wdate{display:flex;flex-direction:column;align-items:flex-start;border-right:1px solid var(--line);padding-right:10px}
.wdate .d{font:700 30px/1 var(--f-disp)}
.wdate .wd{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.wnames{font-weight:600;overflow-wrap:anywhere}
.wmeta{font-size:14px;color:var(--muted)}
.wnote{font-size:14px;font-style:italic;color:var(--ink);overflow-wrap:anywhere;padding-top:2px}
.chev{color:var(--muted);font-size:22px;line-height:1.2;align-self:center}

/* editor */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar .grow{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.bar input[type=date]{width:auto;min-width:150px}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.descprev{font-size:14px;color:var(--muted);margin:0 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.descbox{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.btn.ok{background:var(--up-bg);color:var(--up);border-color:var(--up)}
.btn.ok[disabled]{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.descstate{color:var(--muted)}
div.descro{max-height:44px;overflow-y:auto;padding:0;border:0;background:none;color:var(--ink);font-size:15px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}
div.descro.empty{color:var(--muted);font-style:italic}
textarea.desc1{min-height:68px;height:68px;overflow-y:auto;resize:none;padding-block:10px;line-height:24px}
.exbtns{display:flex;gap:6px}
.prevline{font-size:14px;color:var(--muted);margin-bottom:10px;overflow-wrap:anywhere}
.labels,.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) 12px minmax(0,1fr) 40px;gap:8px;align-items:center}
.labels{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;text-align:center}
.setrow{margin-bottom:8px}
.setrow .idx{font:600 16px var(--f-disp);color:var(--muted);text-align:center}
.setrow .x{text-align:center;color:var(--muted)}
.icon-btn{width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:6px;font-size:22px;line-height:1}
.exactions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.crow{display:flex;flex-direction:column;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.cgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cgrid .sp{height:46px;display:flex;align-items:center;justify-content:center;font:600 20px var(--f-disp);color:var(--ink)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#nav .in{max-width:600px;margin:0 auto;display:flex;gap:8px}
#nav .in .btn{flex:1;white-space:nowrap;padding:0 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:6px}
.tab[aria-current="page"]{color:var(--accent)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);max-height:86%;display:flex;flex-direction:column;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px))}
.sheet .in{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.sheet .list{overflow:auto;min-height:0}
.pick{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pick span{flex:1;font-weight:500}
.sheet .foot{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.sheet .newrow{display:flex;gap:8px}

/* stats */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{min-height:38px;padding:0 12px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font:700 36px/1 var(--f-disp)}
.tile .l{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--accent)}
.chart .b.old{fill-opacity:.5}
.chart .z{fill:var(--line)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart text{font:600 12px var(--f-body);fill:var(--muted);text-anchor:middle}
.chart text.w{font-size:11px;letter-spacing:-.2px}
.chart text.v{fill:var(--ink);font-size:13px}
.xc{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:0}
.xc .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.xc .sub{font-size:14px;color:var(--muted)}
.spark{width:96px;height:32px;display:block}
.spark path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-weight:600;font-size:14px;width:fit-content}
.badge.up{color:var(--up);background:var(--up-bg)}
.badge.down{color:var(--down);background:var(--down-bg)}
.badge.flat,.badge.new{color:var(--flat);background:var(--flat-bg)}
.t-up{color:var(--up)} .t-down{color:var(--down)} .t-flat{color:var(--accent)}
.srow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.srow .dd{font:700 18px var(--f-disp)}
.srow .tt{font-weight:600;text-align:right}
.srow .nn{grid-column:2 / 4;font-size:14px;font-style:italic;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
.srow>*{min-width:0;overflow-wrap:anywhere}

.empty{display:flex;flex-direction:column;gap:12px;padding:20px 16px}
.empty p{color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;gap:8px}
.foot-note{font-size:13px;color:var(--muted);margin-top:18px}
.top{position:relative}
.gear{position:absolute;top:14px;right:0;width:48px;height:48px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.gear svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top h1{padding-right:60px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead .mon{flex:1;text-align:center;font:600 26px/1.1 var(--f-disp);text-transform:capitalize;letter-spacing:.02em}
.calhead .btn{min-width:48px;padding:0 10px;font-size:22px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calwd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:4px 0}
.calday{min-height:46px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:600 17px var(--f-disp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.calday.pad{border:0;background:transparent;visibility:hidden}
.calday.tr{background:var(--up-bg);border-color:var(--up);color:var(--up)}
.calday.tr::after{content:"\2713";font-size:11px;line-height:1}
.datebtn{white-space:nowrap;padding:0 12px;font-variant-numeric:tabular-nums}
.sheet .caldet{border:0;background:none;padding:0;margin:0 0 12px}
.calpop{padding-bottom:4px}
.calday.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.calday.sel.tr::after{color:inherit}
.calgrid.dp .calday{min-height:44px}
.calday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.calday[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.calsum{font-size:14px;color:var(--muted);text-align:center}
.caldet{display:flex;flex-direction:column;gap:10px}
.calnone{font:600 22px var(--f-disp);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dex{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--line)}
.dex b{font-weight:600}
.dex .sets{overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:380px){
  h1{font-size:34px}
  .bar input[type=date]{min-width:130px}
}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
</style>
</head>

function detectLang(){
  try{var v=localStorage.getItem(LANG_KEY);if(LANGS.indexOf(v)>-1)return v;}catch(e){}
  var n=String((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS.indexOf(n)>-1?n:'en';
}
var LANG=detectLang();
function tl(k,l){var r=I18N[k];return l==='pl'||!r?k:r[l==='en'?0:1];}
function t(k,v){
  var x=tl(k,LANG);
  if(v)x=x.replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:m;});
  return x;
}
try{document.documentElement.lang=LANG;document.title=t('Dziennik treningowy');}catch(e){}
function descGet(k){
  var i=k.indexOf(':'),kind=k.slice(0,i),key=k.slice(i+1);
  if(kind==='ex'){var e=S.meta.exercises.filter(function(x){return x.id===key;})[0];return e&&e.desc?e.desc:'';}
  return (S.meta.cardioDesc&&S.meta.cardioDesc[key])||'';
}
function descSet(k,v){
  var i=k.indexOf(':'),kind=k.slice(0,i),key=k.slice(i+1);
  if(kind==='ex'){var e=S.meta.exercises.filter(function(x){return x.id===key;})[0];if(e){if(v)e.desc=v;else delete e.desc;}}
  else{S.meta.cardioDesc=S.meta.cardioDesc||{};if(v)S.meta.cardioDesc[key]=v;else delete S.meta.cardioDesc[key];}
  Store.saveMeta().catch(function(){});
}
function descField(k,name,id,ph){
  var saved=descGet(k),has=S.descDraft[k]!==undefined,val=has?S.descDraft[k]:saved,dirty=has&&val.trim()!==saved;
  var state=dirty?t('Niezapisane zmiany. Kliknij zielony ptaszek, aby zatwierdzić.'):(S.descSaved[k]?t('Zapisano \u2713'):'');
  return '<div class="exrow" style="align-items:stretch"><textarea class="txt desc1" id="'+id+'" data-draft="'+esc(k)+'" rows="2" maxlength="400" style="flex:1;min-width:0" placeholder="'+esc(ph)+'" aria-label="'+esc(t('Opis: {name}',{name:name}))+'">'+esc(val)+'</textarea>'+
    '<button class="btn ok" data-act="confirm-desc" data-k="'+esc(k)+'" aria-label="'+esc(t('Zatwierdź opis'))+'" style="width:52px;height:68px;font-size:24px;padding:0"'+(dirty?'':' disabled')+'>\u2713</button></div>'+
    '<p class="small descstate" data-for="'+esc(k)+'"'+(state?'':' hidden')+'>'+state+'</p>';
}
function refreshDesc(k,ta){
  var saved=descGet(k),val=S.descDraft[k]!==undefined?S.descDraft[k]:saved,dirty=val.trim()!==saved;
  var root=ta.parentNode.parentNode;
  var btn=root.querySelector('button[data-act="confirm-desc"]'),st=root.querySelector('.descstate');
  if(btn)btn.disabled=!dirty;
  if(st){st.hidden=!dirty;st.textContent=dirty?t('Niezapisane zmiany. Kliknij zielony ptaszek, aby zatwierdzić.'):'';}
}
function getTheme(){try{var t=localStorage.getItem(THEME_KEY);return t==='light'||t==='dark'?t:'auto';}catch(e){return 'auto';}}
function applyTheme(t){
  var r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='dark'?'#0C1016':t==='light'?'#E8EBF0':'#1F5FBF');
}
function sameList(a,b){return a.length===b.length&&a.every(function(x,i){return x===b[i];});}
function metaIsDefault(){
  var m=S.meta;if(Object.keys(S.workouts).length)return false;
  if(m.exercises.some(function(e){return e.desc;})||Object.keys(m.cardioDesc||{}).length)return false;
  return LANGS.some(function(l){
    var de=defEx(l),dc=defCardio(l);
    return sameList(m.exercises.map(function(e){return e.id+'|'+e.name;}),de.map(function(e){return e.id+'|'+e.name;}))&&sameList(m.cardio,dc);
  });
}
function setLang(l){
  if(LANGS.indexOf(l)<0||l===LANG)return;
  var swap=metaIsDefault();
  try{localStorage.setItem(LANG_KEY,l);}catch(e){}
  LANG=l;
  try{document.documentElement.lang=LANG;document.title=t('Dziennik treningowy');}catch(e){}
  if(swap){S.meta.exercises=defEx();S.meta.cardio=defCardio();Store.persistLocal();}
}
function setTheme(t){try{if(t==='auto')localStorage.removeItem(THEME_KEY);else localStorage.setItem(THEME_KEY,t);}catch(e){}applyTheme(t);}
var DEF={ex:[['biceps','Biceps'],['kaptury','Kaptury'],['klatka-triceps','Klatka i triceps'],['rozpietki','Rozpiętki'],['sciaganie','Ściąganie do klatki'],['grzbiet','Grzbiet']],cardio:['Rowerek stacjonarny','Bieżnia']};
function defEx(l){l=l||LANG;return DEF.ex.map(function(x){return {id:x[0],name:tl(x[1],l)};});}
function defCardio(l){l=l||LANG;return DEF.cardio.map(function(x){return tl(x,l);});}

/* ---------- helpers ---------- */
var $=function(s,el){return (el||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parseD=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var dm=function(s){var d=parseD(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1);};
var wdName=function(s){return parseD(s).toLocaleDateString(LOC[LANG],{weekday:'short'});};
var todayISO=function(){return iso(new Date());};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;};
var dayDiff=function(a,b){return Math.round((b-a)/86400000);};
var weekStart=function(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
var nfc={};
var fmt=function(n){var l=LOC[LANG];return (nfc[l]=nfc[l]||new Intl.NumberFormat(l,{maximumFractionDigits:1})).format(n);};
var num=function(v){if(v===''||v==null)return null;var n=Number(String(v).replace(',','.'));return isFinite(n)?n:null;};
var dispNum=function(n){return n==null?'':LANG==='en'?String(n):String(n).replace('.',',');};
var parseMin=function(v){
  if(v==null)return null;var s=String(v).trim();if(!s)return null;
  if(s.indexOf(':')>-1){var p=s.split(':');var a=Number(p[0]),b=Number(p[1]||0);return isFinite(a)&&isFinite(b)?a+b/60:null;}
  return num(s);
};
var fmtMin=function(m){if(m==null)return '';var t=Math.round(m*60);var mm=Math.floor(t/60),ss=t%60;return ss?mm+':'+pad(ss):String(mm);};
var plural=function(n,a,b,c){if(LANG!=='pl'){var r=I18N[a+'|'+b+'|'+c],f=(r?r[LANG==='en'?0:1]:a).split('|');return n===1?f[0]:f[1];}var m=n%10,h=n%100;return n===1?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c;};
var pct=function(p){var r=Math.round(Math.abs(p)*100);return (p>0?'+':p<0?'−':'')+r+'%';};

var S={

/* ---------- storage ---------- */
var Store={
  mode:'local',col:null,q:Promise.resolve(),timer:null,
  init:async function(){
    var db=null,uid=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    if(db&&uid){
      try{
        this.col=db.collection('data/users/'+uid);
        this.mode='cloud';S.mode='cloud';
        this.timer=setTimeout(function(){if(!S.synced){S.note=t('Nie można teraz połączyć się z zapisem. Widoczne dane mogą być nieaktualne.');S.ready=true;softRender();}},10000);
        this.col.onSnapshot(function(snap){
          var ws={},meta=null;
          snap.docs.forEach(function(d){
            var v=d.data();if(!v)return;
            if(d.id==='meta')meta=v;
            else if(d.id.indexOf('w-')===0){var o=clone(v);o.id=d.id;ws[d.id]=o;}
          });
          S.workouts=ws;
          if(meta)S.meta=normMeta(meta);
          if(!snap.metadata.fromCache){S.synced=true;S.note='';clearTimeout(Store.timer);}
          S.ready=true;softRender();
        },function(err){
          S.note=t('Zapis w koncie jest niedostępny ({code}). Dane zostają tylko w tej karcie.',{code:(err&&err.code?err.code:t('błąd'))});
          S.synced=true;S.ready=true;Store.mode='local';S.mode='local';softRender();
        });
        return;
      }catch(e){this.mode='local';S.mode='local';}
    }
    this.loadLocal();
    S.synced=true;S.ready=true;
  },
  loadLocal:function(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){var o=JSON.parse(raw);S.workouts=o.workouts||{};if(o.meta)S.meta=normMeta(o.meta);}
    }catch(e){}
  },
  persistLocal:function(){try{localStorage.setItem(KEY,JSON.stringify({workouts:S.workouts,meta:S.meta}));}catch(e){}},
  run:function(op){
    var p=this.q.then(op);
    this.q=p.catch(function(){});
    return p;
  },
  saveWorkout:function(w){
    if(this.mode!=='cloud'){this.persistLocal();return Promise.resolve();}
    var body=clone(w);delete body.id;var col=this.col;
    return this.run(function(){return col.doc(w.id).set(body);});
  },
  deleteWorkout:function(id){
    if(this.mode!=='cloud'){this.persistLocal();return Promise.resolve();}
    var col=this.col;return this.run(function(){return col.doc(id).delete();});
  },
  saveMeta:function(){
    if(this.mode!=='cloud'){this.persistLocal();return Promise.resolve();}
    var col=this.col,body=clone(S.meta);
    return this.run(function(){return col.doc('meta').set(body);});
  }
};
function normMeta(m){
  var ex=Array.isArray(m.exercises)?m.exercises.filter(function(x){return x&&x.id&&x.name;}):defEx();
  var ca=Array.isArray(m.cardio)?m.cardio.filter(Boolean):defCardio();
  var cd={};
  if(m.cardioDesc&&typeof m.cardioDesc==='object'){Object.keys(m.cardioDesc).forEach(function(k){if(typeof m.cardioDesc[k]==='string'&&m.cardioDesc[k])cd[k]=m.cardioDesc[k];});}
  return {exercises:ex,cardio:ca,cardioDesc:cd};
}

/* ---------- data helpers ---------- */
function allWorkouts(){
  return Object.keys(S.workouts).map(function(k){return S.workouts[k];}).sort(function(a,b){
    return a.date<b.date?-1:a.date>b.date?1:(a.updated||0)-(b.updated||0);
  });
}
function validSets(sets){return (sets||[]).filter(function(s){return s&&s.r>0&&s.kg!=null&&s.kg>=0;});}
function exName(id,fb){var e=S.meta.exercises.filter(function(x){return x.id===id;})[0];return e?e.name:(fb||id);}
function history(exId){
  var out=[];
  allWorkouts().forEach(function(w){
    (w.entries||[]).forEach(function(en){
      if(en.ex!==exId)return;
      var v=validSets(en.sets);if(!v.length)return;
      var ton=0,reps=0,maxKg=0,e1=null;
      v.forEach(function(s){
        ton+=s.r*s.kg;reps+=s.r;if(s.kg>maxKg)maxKg=s.kg;
        if(s.r<=12&&s.kg>0){var e=s.kg*(1+s.r/30);if(e1==null||e>e1)e1=e;}
      });
      out.push({wid:w.id,date:w.date,sets:v,ton:ton,reps:reps,maxKg:maxKg,e1:e1,note:en.note||'',name:en.name});
    });
  });
  return out;
}
function metric(h){return h.ton>0?h.ton:h.reps;}
function trendOf(list,val){
  var n=list.length;
  if(n<2)return {kind:'new'};
  var a=val(list[n-1]),b=val(list[n-2]);
  var p=b>0?(a-b)/b:0;
  var kind=p>0.02?'up':p<-0.02?'down':'flat';
  var total=null;
  if(n>=3){var f=val(list[0]);if(f>0)total=(a-f)/f;}
  return {kind:kind,pct:p,total:total};
}
function badge(b){
  if(b.kind==='up')return '<span class="badge up">'+esc(t('▲ Progres {p}',{p:pct(b.pct)}))+'</span>';
  if(b.kind==='down')return '<span class="badge down">'+esc(t('▼ Regres {p}',{p:pct(b.pct)}))+'</span>';
  if(b.kind==='flat')return '<span class="badge flat">'+esc(t('● Bez zmian'))+'</span>';
  return '<span class="badge new">'+esc(t('Pierwszy zapis'))+'</span>';
}
function spark(vals,kind){
  vals=vals.slice(-12);var n=vals.length;if(!n)return '';
  var W=96,H=32,p=4,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var pts=vals.map(function(v,i){
    return [n===1?W/2:p+i*(W-2*p)/(n-1), mx===mn?H/2:H-p-(v-mn)/(mx-mn)*(H-2*p)];
  });
  var d=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ');
  var last=pts[n-1];
  return '<svg class="spark t-'+kind+'" viewBox="0 0 96 32" aria-hidden="true">'+(n>1?'<path d="'+d+'"/>':'')+'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3"/></svg>';
}
function prevCardio(m,w){
  var out=null;
  allWorkouts().forEach(function(x){
    if(x.id===w.id||x.date>w.date)return;
    (x.cardio||[]).forEach(function(c){if(c.m===m&&(c.km!=null||c.min!=null))out={date:x.date,km:c.km,min:c.min};});
  });
  return out;
}
function prevFor(exId,w){
  var h=history(exId).filter(function(x){return x.wid!==w.id&&x.date<=w.date;});
  return h.length?h[h.length-1]:null;
}
function setsText(sets){return sets.map(function(s){return s.r+'×'+dispNum(s.kg);}).join(' · ')+' kg';}
function speedOf(c){return c.km>0&&c.min>0?c.km/(c.min/60):null;}

function weekBars(ws){
  var base=weekStart(new Date()),weeks=[];
  for(var i=7;i>=0;i--){var d=addDays(base,-7*i);weeks.push({k:iso(d),n:0,d:d});}
  ws.forEach(function(w){var k=iso(weekStart(parseD(w.date)));weeks.forEach(function(x){if(x.k===k)x.n++;});});
  var max=Math.max(2,Math.max.apply(null,weeks.map(function(x){return x.n;})));
  var W=320,H=140,pb=40,pt=18,step=40,bw=26,x0=(W-8*step)/2+(step-bw)/2;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('Liczba treningów w ostatnich 8 tygodniach'))+'">';
  s+='<line class="base" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  weeks.forEach(function(x,i){
    var cx=x0+i*step+bw/2,h=x.n/max*(H-pb-pt),y=H-pb-h,cur=i===7;
    if(x.n>0){s+='<rect class="b'+(cur?'':' old')+'" x="'+(x0+i*step)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="2"/><text class="v" x="'+cx+'" y="'+(y-5).toFixed(1)+'">'+x.n+'</text>';}
    else{s+='<rect class="z" x="'+(x0+i*step)+'" y="'+(H-pb-2)+'" width="'+bw+'" height="2"/>';}
    s+='<text class="w" x="'+cx+'" y="'+(H-21)+'">'+dm(x.k)+'</text><text class="w" x="'+cx+'" y="'+(H-7)+'">\u2013'+dm(iso(addDays(x.d,6)))+'</text>';
  });
  return s+'</svg>';
}

  var cut=S.range==='all'?null:iso(addDays(new Date(),-Number(S.range)));
  var inR=ws.filter(function(w){return !cut||w.date>=cut;});
  var sets=0,ton=0,km=0;

  });
  var fromD=parseD(ws[0].date);if(cut&&parseD(cut)>fromD)fromD=parseD(cut);

  var avg=inR.length/Math.max(1,weeks);
  var seg='<div class="seg" role="group" aria-label="'+esc(t('Zakres'))+'">'+[['30',t('30 dni')],['90',t('90 dni')],['all',t('Wszystko')]].map(function(r){

  out+='<section class="sec"><h2>'+esc(t('Treningi w tygodniach'))+'</h2><div class="card">'+weekBars(ws)+'</div></section>';

  /* exercises */
  var ids={};S.meta.exercises.forEach(function(e){ids[e.id]=1;});
  ws.forEach(function(w){(w.entries||[]).forEach(function(en){ids[en.ex]=1;});});
  var rows=Object.keys(ids).map(function(id){
    var h=history(id);if(!h.length)return null;
    return {id:id,h:h,t:trendOf(h,metric),last:h[h.length-1]};
  }).filter(Boolean).sort(function(a,b){
    return a.last.date<b.last.date?1:a.last.date>b.last.date?-1:exName(a.id).localeCompare(exName(b.id),LOC[LANG]);
  });
  out+='<section class="sec"><h2>'+esc(t('Ćwiczenia'))+'</h2><div class="stack">';
  rows.forEach(function(r){
    var h=r.h,n=h.length,last=h[n-1],prev=n>1?h[n-2]:null,open=!!S.open['x'+r.id];
    var sub=t('Ostatnio {d}: {v} kg tonażu',{d:dm(last.date),v:fmt(last.ton)});
    if(prev)sub+=t(' (poprzednio {v})',{v:fmt(prev.ton)});
    var extra='';
    if(prev&&last.maxKg!==prev.maxKg){
      var dk=last.maxKg-prev.maxKg;
      extra+='<div class="sub '+(dk<0?'t-down':'t-up')+'">'+esc(t('Najcięższa seria: {kg} kg ({d} kg)',{kg:dispNum(last.maxKg),d:(dk>0?'+':'−')+dispNum(Math.abs(Math.round(dk*10)/10))}))+'</div>';
    }
    if(r.t.total!=null)extra+='<div class="sub">'+esc(t('Od pierwszego zapisu: {p} tonażu',{p:pct(r.t.total)}))+'</div>';
    var best=h.reduce(function(a,b){return b.maxKg>a.maxKg?b:a;},h[0]);
    var e1=h.reduce(function(a,b){return b.e1!=null&&(a==null||b.e1>a)?b.e1:a;},null);
    var detail='';
    if(open){
      detail='<div class="chips"><span class="chip">'+esc(t('Rekord: {kg} kg ({d})',{kg:dispNum(best.maxKg),d:dm(best.date)}))+'</span>'+(e1!=null?'<span class="chip">'+esc(t('Szac. 1RM: ~{v} kg',{v:fmt(e1)}))+'</span>':'')+'<span class="chip">'+n+' '+esc(plural(n,'zapis','zapisy','zapisów'))+'</span></div><div style="margin-top:10px">'+
        h.slice().reverse().map(function(x){
          return '<div class="srow"><span class="dd">'+dm(x.date)+'</span><span>'+esc(setsText(x.sets))+'</span><span class="tt">'+fmt(x.ton)+' kg</span>'+(x.note?'<span class="nn">'+esc(x.note)+'</span>':'')+'</div>';
        }).join('')+'</div>';
    }
    out+='<div class="card"><button class="xc" data-act="toggle" data-k="x'+esc(r.id)+'" aria-expanded="'+open+'"><span class="l"><h3>'+esc(exName(r.id,last.name))+'</h3>'+badge(r.t)+'<span class="sub">'+sub+'</span>'+extra+'</span>'+spark(h.map(metric),r.t.kind==='up'?'up':r.t.kind==='down'?'down':'flat')+'</button>'+detail+'</div>';
  });
  out+='</div></section>';

  /* cardio */
  var cm={};
  ws.forEach(function(w){(w.cardio||[]).forEach(function(c){
    (cm[c.m]=cm[c.m]||[]).push({date:w.date,km:c.km,min:c.min,speed:speedOf(c)});
  });});
  var names=Object.keys(cm);
  if(names.length){
    out+='<section class="sec"><h2>'+esc(t('Cardio'))+'</h2><div class="stack">';
    names.forEach(function(m){
      var h=cm[m],tr=trendOf(h,function(c){return c.speed!=null?c.speed:(c.km||0);}),open=!!S.open['c'+m];
      var last=h[h.length-1];
      var sub=last.speed?t('Ostatnio {d}: {v} km/h',{d:dm(last.date),v:fmt(last.speed)}):t('Ostatnio {d}',{d:dm(last.date)});
      var detail='';
      if(open){
        detail='<div style="margin-top:12px">'+h.slice().reverse().map(function(x){
          return '<div class="srow"><span class="dd">'+dm(x.date)+'</span><span>'+(x.km!=null?dispNum(x.km)+' km':'')+(x.min!=null?' · '+fmtMin(x.min)+' min':'')+'</span><span class="tt">'+(x.speed?fmt(x.speed)+' km/h':'—')+'</span></div>';
        }).join('')+'</div>';
      }
      out+='<div class="card"><button class="xc" data-act="toggle" data-k="c'+esc(m)+'" aria-expanded="'+open+'"><span class="l"><h3>'+esc(m)+'</h3>'+badge(tr)+'<span class="sub">'+sub+'</span></span>'+spark(h.map(function(c){return c.speed!=null?c.speed:(c.km||0);}),tr.kind==='up'?'up':tr.kind==='down'?'down':'flat')+'</button>'+detail+'</div>';
    });
    out+='</div></section>';
  }
  out+='<p class="foot-note">'+esc(t('Tonaż to suma powtórzeń × ciężar ze wszystkich serii. Progres i regres porównują dwa ostatnie treningi danego ćwiczenia (zmiana powyżej 2%). Szac. 1RM liczony wzorem Epleya z serii do 12 powtórzeń.'))+'</p>';
  return out;
}

function ph(en,prev,si,key){
  var p=prev&&prev.sets[si];
  if(p&&p[key]!=null)return dispNum(p[key]);
  for(var j=si-1;j>=0;j--){var s=en.sets[j];if(s&&s[key]!=null)return dispNum(s[key]);}
  return '';
}

function sheetHTML(){
  if(S.sheet.kind==='date')return datepickHTML();
  var w=S.editing,used={},usage={},cardio=S.sheet.kind==='cardio';
  var list;
  if(cardio){
    w.cardio.forEach(function(c){used[c.m]=1;});
    allWorkouts().forEach(function(x){(x.cardio||[]).forEach(function(c){usage[c.m]=(usage[c.m]||0)+1;});});
    list=S.meta.cardio.map(function(m){return {id:m,name:m};});
  }else{
    w.entries.forEach(function(e){used[e.ex]=1;});
    allWorkouts().forEach(function(x){(x.entries||[]).forEach(function(e){usage[e.ex]=(usage[e.ex]||0)+1;});});
    list=S.meta.exercises.slice();
  }
  list.sort(function(a,b){return (usage[b.id]||0)-(usage[a.id]||0)||a.name.localeCompare(b.name,LOC[LANG]);});
  var sel=S.sheet.sel||[];
  var rows=list.map(function(e){

  }).join('');
  var title=cardio?t('Dodaj cardio'):t('Dodaj ćwiczenia'),ph=cardio?t('Nowe urządzenie'):t('Nowe ćwiczenie');

    '<div class="head"><h2>'+esc(title)+'</h2><button class="btn sm ghost" data-act="close-sheet">'+esc(t('Zamknij'))+'</button></div>'+

/* ---------- editor logic ---------- */
function newDraft(){return {id:'w-'+todayISO()+'-'+rid(),date:todayISO(),note:'',cardio:[],entries:[]};}
function openDraft(id){
  var w=clone(S.workouts[id]);
  w.note=w.note||'';w.cardio=w.cardio||[];w.entries=(w.entries||[]).map(function(e){e.sets=e.sets||[];e.note=e.note||'';return e;});
  return w;
}
function cleanWorkout(w){
  var o={date:w.date,note:(w.note||'').trim(),cardio:[],entries:[],updated:Date.now()};
  (w.cardio||[]).forEach(function(c){if(c.km!=null||c.min!=null)o.cardio.push({m:(c.m||'').trim()||'Cardio',km:c.km==null?null:c.km,min:c.min==null?null:c.min});});
  (w.entries||[]).forEach(function(en){
    var s=(en.sets||[]).filter(function(x){return x.r!=null||x.kg!=null;}).map(function(x){return {r:x.r,kg:x.kg};});
    var note=(en.note||'').trim();
    if(s.length||note)o.entries.push({ex:en.ex,name:en.name,sets:s,note:note});
  });
  return o;
}
var hasContent=function(o){return !!(o.note||o.cardio.length||o.entries.length);};
var saveTimer=null;
function touch(){S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);setSave(t('Zapisywanie…'));}
async function flush(){
  clearTimeout(saveTimer);
  var w=S.editing;if(!w||!S.dirty)return;
  S.dirty=false;
  var o=cleanWorkout(w);
  if(!hasContent(o)){setSave('');return;}
  o.id=w.id;
  var metaChanged=false;
  o.cardio.forEach(function(c){if(S.meta.cardio.indexOf(c.m)<0&&c.m!=='Cardio'){S.meta.cardio.push(c.m);metaChanged=true;}});
  S.workouts[w.id]=o;
  try{
    await Store.saveWorkout(o);
    if(metaChanged)await Store.saveMeta();
    setSave(t('Zapisano ✓'));
  }catch(err){
    S.dirty=true;
    setSave(err&&err.code==='quota_exceeded'?t('Limit danych jest pełny. Usuń stare treningi.'):t('Nie zapisano. Zmień coś, aby spróbować ponownie.'));
  }
}
async function closeEditor(){
  await flush();
  if(S.dirty){return;}
  var w=S.editing,o=cleanWorkout(w);
  if(!hasContent(o)&&S.workouts[w.id]){
    delete S.workouts[w.id];
    try{await Store.deleteWorkout(w.id);}catch(e){}
  }
  S.editing=null;S.sheet=null;render();
}
function addEntries(ids){
  var w=S.editing,firstIdx=w.entries.length;
  ids.forEach(function(id){
    var ex=S.meta.exercises.filter(function(x){return x.id===id;})[0];if(!ex)return;
    var prev=prevFor(id,w);
    var n=prev?Math.max(1,Math.min(prev.sets.length,6)):3;
    var sets=[];for(var i=0;i<n;i++)sets.push({r:null,kg:null});
    w.entries.push({ex:id,name:ex.name,note:'',sets:sets});
  });
  return firstIdx;
}
function confirmTap(el,fn){

  var orig=el.textContent;el.dataset.armed='1';el.textContent=t('Potwierdź');el.classList.add('danger');
  setTimeout(function(){if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.textContent=orig;el.classList.remove('danger');}},3500);
}

function csvEscape(v){v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function exportCsv(){
  var G=t('siłownia'),CA=t('cardio');
  var rows=[[t('data'),t('typ'),t('nazwa'),t('seria'),t('powtórzenia'),'kg','km',t('minuty'),t('notatka')]];
  allWorkouts().forEach(function(w){
    (w.entries||[]).forEach(function(en){
      var nm=exName(en.ex,en.name);
      if(!(en.sets||[]).length)rows.push([w.date,G,nm,'','','','','',[w.note,en.note].filter(Boolean).join(' | ')]);
      (en.sets||[]).forEach(function(s,i){rows.push([w.date,G,nm,i+1,s.r==null?'':s.r,dispNum(s.kg),'','',i===0?[w.note,en.note].filter(Boolean).join(' | '):'']);});
    });
    (w.cardio||[]).forEach(function(c){rows.push([w.date,CA,c.m,'','','',dispNum(c.km),fmtMin(c.min),w.note||'']);});
  });
  var csv='﻿'+rows.map(function(r){return r.map(csvEscape).join(';');}).join('\r\n');
  deliver('dziennik-treningowy.csv',csv,'text/csv;charset=utf-8');
}

async function applyUpdate(){

  }catch(e){}

function saveFile(name,data,type){

  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}

async function copyText(){

}
/* Zapis pliku: natywne udostępnianie w APK, w przeglądarce zwykłe pobieranie. W razie braku obu: kopiowanie tekstu. */
async function deliver(name,text,type){
  var C=window.Capacitor,native=!!(C&&C.isNativePlatform&&C.isNativePlatform());
  dataPanel('');
  if(native){
    var P=C.Plugins||{};
    if(P.Filesystem&&P.Share){
      try{
        var w=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
        await P.Share.share({title:name,url:w.uri,dialogTitle:t('Zapisz lub wyślij plik')});
        dataMsg(t('Wybierz, gdzie zapisać plik (np. Dysk Google, Pliki albo e-mail).'));
        return;
      }catch(e){
        if(e&&/cancel/i.test(String(e.message||e))){dataMsg(t('Anulowano.'));return;}
      }
    }
    dataMsg('');
    showCopyPanel(text,t('Zapis pliku nie jest tu dostępny. Skopiuj zawartość i wklej do notatki lub e-maila, a potem zapisz ją jako plik.'));
    return;
  }
  try{saveFile(name,text,type);dataMsg(t('Plik zapisany w pobranych. Jeśli go nie widzisz, użyj „Skopiuj kopię jako tekst”.'));}
  catch(e){dataMsg('');showCopyPanel(text,t('Nie udało się zapisać pliku. Skopiuj zawartość ręcznie.'));}
}
async function importJsonText(text){
  try{
    var o=JSON.parse(text);
    if(!o||o.app!=='dziennik-treningowy'||!Array.isArray(o.workouts))throw new Error('format');
    var n=0;
    o.workouts.forEach(function(w){if(w&&w.id&&w.date){S.workouts[w.id]=w;n++;}});
    if(o.meta){
      var m=normMeta(o.meta);
      m.exercises.forEach(function(e){var ex=S.meta.exercises.filter(function(x){return x.id===e.id;})[0];if(!ex)S.meta.exercises.push(e);else if(!ex.desc&&e.desc)ex.desc=e.desc;});
      m.cardio.forEach(function(c){if(S.meta.cardio.indexOf(c)<0)S.meta.cardio.push(c);});
      S.meta.cardioDesc=S.meta.cardioDesc||{};
      Object.keys(m.cardioDesc||{}).forEach(function(k){if(!S.meta.cardioDesc[k])S.meta.cardioDesc[k]=m.cardioDesc[k];});
    }
    Store.persistLocal();
    render({keep:true});
    dataMsg(t('Wczytano {n} {w} z kopii.',{n:n,w:plural(n,'trening','treningi','treningów')}));
  }catch(e){dataMsg(t('To nie jest poprawna kopia z tej aplikacji.'));}
}
async function importJson(file){
  try{await importJsonText(await file.text());}catch(e){dataMsg(t('Nie udało się odczytać pliku. Użyj „Wklej kopię z tekstu”.'));}
}
document.addEventListener('click',function(ev){

    case 'open-sheet':S.sheet={kind:'ex',sel:[]};render({keep:true});break;

    case 'add-cardiolist':{

      S.meta.cardioDesc=S.meta.cardioDesc||{};
      if(S.meta.cardioDesc[old]){S.meta.cardioDesc[v]=S.meta.cardioDesc[old];delete S.meta.cardioDesc[old];}
      ['c:'+old].forEach(function(ok){var nk='c:'+v;if(S.descOpenList[ok]){S.descOpenList[nk]=true;delete S.descOpenList[ok];}if(S.descDraft[ok]!==undefined){S.descDraft[nk]=S.descDraft[ok];delete S.descDraft[ok];}});
    }
    S.meta.cardio[i]=v;Store.saveMeta().catch(function(){});
  }
});
document.addEventListener('focusin',function(ev){var t=ev.target;if(t.matches&&t.matches('input[data-sel]'))setTimeout(function(){try{t.select();}catch(e){}},0);});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet){S.sheet=null;render({keep:true});}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();});

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
try{if(location.search.indexOf('u=')>-1)history.replaceState(null,'',location.pathname);}catch(e){}
render();
Store.init().then(function(){render();}).catch(function(){S.ready=true;render();});
})();
</script>
